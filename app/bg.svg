<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f6c"/>
      <stop offset="0.3" stop-color="#8eaa88"/>
      <stop offset="0.6" stop-color="#7a9873"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa05a"/>
      <stop offset="0.4" stop-color="#4f7a36"/>
      <stop offset="1" stop-color="#173020"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">

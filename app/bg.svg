      <stop offset="0.5" stop-color="#e6efe2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6efe2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f14" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1f14" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#fbfff0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbfff0" stop-opacity="0"/>
